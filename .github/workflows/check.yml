name: Check
on: [push, pull_request]
permissions:
    contents: read
jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
            - uses: gradle/actions/setup-gradle@v4
            - run: ./gradlew build
            - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
            - run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./gradlew runClientGameTest
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - uses: actions/checkout@v4
              with:
                  repository: IvanBanny/dirtflow-v0-engine
                  ref: 3c6610112955049180faf266c96b8b366e1fc7b1
                  path: build/engine
            - run: python -m pip install numpy==2.4.6 fastapi==0.136.3 uvicorn==0.49.0 pydantic==2.13.4 sse-starlette==3.4.4
            - run: DIRTFLOW_ENGINE_PYTHON="$(command -v python)" PYTHONPATH="$PWD/build/engine/src" ./gradlew engineIntegrationTest
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: checks
                  path: |
                      build/reports/
                      build/run/clientGameTest/screenshots/
                      build/run/clientGameTest/logs/
                      build/libs/*.jar
    release:
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: checks
            - run: |
                  if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      exit 0
                  fi
                  cd libs
                  jar="dirtflow-v0-mod-${GITHUB_REF_NAME#v}.jar"
                  sha256sum "$jar" > SHA256SUMS
                  gh release create "$GITHUB_REF_NAME" "$jar" SHA256SUMS \
                      --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
                      --title "Dirtflow mod $GITHUB_REF_NAME" --notes ""
              env:
                  GH_TOKEN: ${{ github.token }}
